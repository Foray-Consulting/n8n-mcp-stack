version: "3.9"
services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678" # n8n UI
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - TZ=America/Los_Angeles
    volumes:
      - ./n8n_data:/home/node/.n8n
    networks: [n8nnet]
    depends_on: [mcp_fetch]

  # Example 1 – web-scraping “fetch” MCP server
  mcp_fetch:
    image: supercorp/supergateway:latest
    command: >
      --stdio "npx -y @kazuph/mcp-fetch"
      --port 8001
      --baseUrl http://mcp_fetch:8001
    ports:
      - "8001:8001"
    networks: [n8nnet]

  # Example 2 – local-filesystem MCP (optional)
  mcp_fs:
    image: supercorp/supergateway:latest
    command: >
      --stdio "npx -y @modelcontextprotocol/server-filesystem /data"
      --port 8002
      --baseUrl http://mcp_fs:8002
    volumes:
      - ./fs_data:/data
    ports:
      - "8002:8002"
    networks: [n8nnet]
  
    # GitHub MCP server
  mcp_github:
    image: supercorp/supergateway:latest
    env_file: [.env-github]
    command: >
      --stdio "npx -y @modelcontextprotocol/server-github"
      --port 8003
      --baseUrl http://mcp_github:8003
    ports:
      - "8104:8003"             # host 8104  ←→  container 8003
    networks: [n8nnet]

networks:
  n8nnet: